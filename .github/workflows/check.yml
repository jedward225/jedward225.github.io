name: Check site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - run: python3 scripts/check_site.py
      - run: node --check assets/js/main.js && node --check assets/js/theme.js
      - name: Check subdirectory URLs
        run: |
          bundle exec jekyll build --baseurl /preview --destination /tmp/site-preview
          python3 scripts/check_site.py /tmp/site-preview /preview
